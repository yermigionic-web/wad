<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0E">
<meta name="color-scheme" content="dark">
<title>WET &amp; DRY — 벨-아르카 분지 기록</title>
<!--
  단일 파일 문서.
  [SECTION 1: CSS]
  [SECTION 2: HTML]
  [SECTION 3: ASSET & DATA CONFIG]
  [SECTION 4: JS LOGIC]
  경로·대사·프로필·문항은 SECTION 3만 고치면 화면에 반영된다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Gowun+Batang:wght@400;700&family=IM+Fell+English:ital@0;1&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ============================================================
     [SECTION 1: CSS]
     ============================================================ -->
<style>
  :root {
    --obsidian: #0A0C0E;
    --slate: #131619;
    --iron: #1E2226;
    --ink: #D6D1C4;
    --ink-dim: rgba(214, 209, 196, 0.62);
    --ink-faint: rgba(214, 209, 196, 0.38);
    --brass: #8C764C;
    --brass-line: rgba(140, 118, 76, 0.55);
    --verdi: #3C5E5A;
    --wet: #1E4D54;
    --wet-hot: #7A1C24;
    --dry: #8F4329;
    --dry-hot: #B86F28;
    --climate: var(--wet);
    --climate-hot: var(--wet-hot);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --chamfer: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
    --chamfer-sm: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
    --serif: "Gowun Batang", "Noto Serif KR", "Batang", serif;
    --display-ko: "Noto Serif KR", "Gowun Batang", serif;
    --caps: "Cinzel", "Times New Roman", serif;
    --alias: "Cormorant Garamond", Palatino, "Palatino Linotype", serif;
    --latin: "IM Fell English", Palatino, "Palatino Linotype", serif;
  }

  #stage[data-climate="dry"] {
    --climate: var(--dry);
    --climate-hot: var(--dry-hot);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #050607;
    color: var(--ink);
    overflow: hidden;
  }
  body {
    font-family: var(--serif);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  img { display: block; max-width: 100%; -webkit-user-drag: none; }
  img.is-broken { visibility: hidden; }
  p { margin: 0; }
  h1, h2, h3 { font-family: var(--display-ko); font-weight: 500; margin: 0; }
  ::selection { background: #3C5E5A; color: var(--ink); }
  :focus-visible { outline: 1px solid var(--brass); outline-offset: 3px; }

  .caps {
    font-family: var(--caps);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 10px;
  }
  .latin { font-family: var(--latin); letter-spacing: 0.02em; }
  .alias { font-family: var(--alias); font-style: italic; font-weight: 500; }

  .prose, .vn-text, .acc-inner, .face, .quote, .copy-preview, .q-prompt, .choice, .bubble {
    user-select: text;
    -webkit-user-select: text;
  }

  /* stage */
  #void {
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    overflow: hidden;
    overflow: clip;
    background: #050607;
  }
  #stage {
    position: relative;
    width: min(100%, 430px);
    height: 100%;
    overflow: hidden;
    overflow: clip;
    background: var(--obsidian);
    color: var(--ink);
    box-shadow: 0 0 0 1px rgba(140, 118, 76, 0.22);
  }

  .screen {
    position: absolute;
    inset: 0;
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
  }
  .screen.is-on {
    visibility: visible;
    pointer-events: auto;
    opacity: 1;
  }

  /* grain — topmost, clicks pass through */
  .grain {
    position: absolute;
    left: -8%;
    top: -8%;
    width: 116%;
    height: 116%;
    pointer-events: none;
    z-index: 100;
  }
  .grain-fine {
    mix-blend-mode: overlay;
    opacity: 0.42;
    animation: grainShift 0.55s steps(2) infinite;
  }
  .grain-paper {
    mix-blend-mode: soft-light;
    opacity: 0.34;
  }
  @keyframes grainShift {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-1.4%, 0.5%); }
    50% { transform: translate(0.8%, -1.1%); }
    75% { transform: translate(-0.6%, 0.9%); }
    100% { transform: translate(0, 0); }
  }

  /* audio + skip, always in the stage corner */
  .audio-btn {
    position: absolute;
    top: calc(8px + var(--safe-t));
    right: 6px;
    z-index: 80;
    width: 44px;
    height: 44px;
    color: var(--ink);
    display: grid;
    place-items: center;
  }
  .audio-btn svg { width: 22px; height: 22px; }
  .audio-btn.is-off .wave { display: none; }
  .audio-btn:not(.is-off) .slash { display: none; }

  .skip-btn {
    position: absolute;
    top: calc(8px + var(--safe-t));
    right: 50px;
    z-index: 50;
    height: 44px;
    padding: 0 6px;
    font-family: var(--caps);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
  }
  #stage[data-screen="vn"] .skip-btn { opacity: 1; pointer-events: auto; }
  .skip-btn span {
    border-bottom: 1px solid var(--brass-line);
    padding-bottom: 2px;
  }

  /* iris shutter */
  .iris {
    --r: 1400px;
    --spin: 0deg;
    position: absolute;
    inset: 0;
    z-index: 74;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 50% 50%, transparent var(--r), #050607 calc(var(--r) + 1.5px));
  }
  .iris.is-active { opacity: 1; pointer-events: auto; }
  .iris-ring {
    position: absolute;
    inset: 0;
    background: repeating-conic-gradient(from var(--spin), rgba(140, 118, 76, 0.95) 0deg 1.5deg, transparent 1.5deg 20deg);
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent calc(var(--r) - 15px), #000 calc(var(--r) - 11px), #000 calc(var(--r) + 0.5px), transparent calc(var(--r) + 2px));
    mask: radial-gradient(circle at 50% 50%, transparent calc(var(--r) - 15px), #000 calc(var(--r) - 11px), #000 calc(var(--r) + 0.5px), transparent calc(var(--r) + 2px));
  }

  .veil {
    position: absolute;
    inset: 0;
    z-index: 71;
    background: #050607;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  .veil.is-on { opacity: 1; }

  .logo-fx {
    position: absolute;
    inset: 0;
    z-index: 73;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 0;
  }
  .logo-fx img { width: min(70%, 280px); height: auto; }
  .logo-fx.is-on { animation: logoFlash 0.95s ease forwards; }
  @keyframes logoFlash {
    0% { opacity: 0; }
    18% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  .logo-fx.is-on img { animation: logoGlow 0.95s ease forwards; }
  @keyframes logoGlow {
    0% { filter: blur(10px) brightness(2.2); transform: scale(0.92); opacity: 0; }
    32% { filter: blur(0) brightness(1.65); transform: scale(1); opacity: 1; }
    100% { filter: blur(1px) brightness(1); transform: scale(1.04); opacity: 0; }
  }

  /* ---------- landing ---------- */
  #screen-landing { background: var(--obsidian); }
  .land-bg { position: absolute; inset: 0; overflow: hidden; }
  .land-bg img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(1.6px) brightness(0.4) saturate(0.72);
    transform: scale(1.06);
  }
  .land-shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(5, 6, 7, 0.55), transparent 22%, transparent 48%, rgba(5, 6, 7, 0.88) 100%),
      radial-gradient(ellipse at center, transparent 28%, rgba(5, 6, 7, 0.78) 100%);
  }
  .fog { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .fog i {
    position: absolute;
    width: 46%;
    height: 22%;
    background: radial-gradient(ellipse, rgba(214, 209, 196, 0.16), transparent 70%);
    filter: blur(10px);
    animation: fogDrift 26s linear infinite;
    opacity: 0.35;
  }
  .fog i:nth-child(1) { left: -20%; top: 18%; }
  .fog i:nth-child(2) { left: 30%; top: 40%; animation-duration: 34s; animation-delay: -8s; width: 55%; }
  .fog i:nth-child(3) { left: -10%; top: 62%; animation-duration: 30s; animation-delay: -14s; }
  .fog i:nth-child(4) { left: 40%; top: 8%; animation-duration: 22s; animation-delay: -4s; width: 30%; height: 14%; }
  .fog i:nth-child(5) { left: 10%; top: 78%; width: 8px; height: 8px; border-radius: 50%; filter: blur(0); background: rgba(214, 209, 196, 0.45); animation-duration: 18s; }
  .fog i:nth-child(6) { left: 70%; top: 30%; width: 3px; height: 3px; border-radius: 50%; filter: blur(0); background: rgba(214, 209, 196, 0.4); animation-duration: 16s; animation-delay: -6s; }
  .fog i:nth-child(7) { left: 22%; top: 48%; width: 2px; height: 2px; border-radius: 50%; filter: blur(0); background: rgba(140, 118, 76, 0.7); animation-duration: 20s; animation-delay: -11s; }
  .fog i:nth-child(8) { left: 80%; top: 70%; width: 4px; height: 4px; border-radius: 50%; filter: blur(0); background: rgba(214, 209, 196, 0.35); animation-duration: 24s; animation-delay: -3s; }
  @keyframes fogDrift {
    0% { transform: translate3d(-6%, 0, 0); opacity: 0.15; }
    50% { opacity: 0.5; }
    100% { transform: translate3d(18%, -8%, 0); opacity: 0.12; }
  }

  .crop {
    position: absolute;
    width: 14px;
    height: 14px;
    z-index: 3;
    pointer-events: none;
    border: 0 solid rgba(140, 118, 76, 0.75);
  }
  .crop.tl { top: calc(10px + var(--safe-t)); left: 10px; border-top-width: 1px; border-left-width: 1px; }
  .crop.tr { top: calc(10px + var(--safe-t)); right: 10px; border-top-width: 1px; border-right-width: 1px; }
  .crop.bl { bottom: calc(10px + var(--safe-b)); left: 10px; border-bottom-width: 1px; border-left-width: 1px; }
  .crop.br { bottom: calc(10px + var(--safe-b)); right: 10px; border-bottom-width: 1px; border-right-width: 1px; }

  .reg {
    position: absolute;
    z-index: 3;
    top: calc(18px + var(--safe-t));
    left: 28px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-family: var(--caps);
    font-size: 9px;
    letter-spacing: 0.22em;
    color: var(--ink-dim);
  }
  .spine {
    position: absolute;
    z-index: 3;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    writing-mode: vertical-rl;
    font-family: var(--caps);
    font-size: 9px;
    letter-spacing: 0.32em;
    color: var(--ink-faint);
    pointer-events: none;
  }

  .land-center {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    top: 46%;
    transform: translateY(-52%);
  }
  .hero-mark {
    position: relative;
    width: min(92%, 390px);
    margin: 0 auto;
  }
  .reticle-svg {
    width: 100%;
    height: auto;
    display: block;
    animation: spin 96s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-slot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 66%;
    transform: translate(-50%, -52%);
  }
  .logo-slot img { width: 100%; height: auto; filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.55)); }
  .flourish {
    position: absolute;
    width: 46px;
    height: 46px;
    color: var(--brass);
    opacity: 0.8;
    pointer-events: none;
  }
  .flourish.tl { top: 0; left: 0; }
  .flourish.tr { top: 0; right: 0; transform: scaleX(-1); }
  .flourish.br { bottom: 0; right: 0; transform: scale(-1); }
  .flourish.bl { bottom: 0; left: 0; transform: scaleY(-1); }

  .enter-wrap {
    position: absolute;
    z-index: 4;
    left: 16px;
    right: 16px;
    bottom: calc(22px + var(--safe-b));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .land-file {
    font-family: var(--latin);
    font-size: 14px;
    color: var(--ink-dim);
    pointer-events: none;
  }
  .enter {
    width: 100%;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: var(--ink);
  }
  .enter-plus {
    color: var(--brass);
    font-family: var(--caps);
    font-size: 13px;
    line-height: 1;
    animation: breath 3.6s ease-in-out infinite;
  }
  .enter-label {
    font-family: var(--caps);
    font-size: clamp(9px, 2.55vw, 12px);
    letter-spacing: 0.16em;
    white-space: nowrap;
  }
  .enter-rule {
    display: block;
    height: 1px;
    background: var(--brass);
    transform-origin: center;
    animation: breath 3.6s ease-in-out infinite;
  }
  .enter-rule.a { width: 46%; }
  .enter-rule.b { width: 28%; animation-delay: 0.45s; opacity: 0.7; }
  @keyframes breath {
    0%, 100% { opacity: 0.32; transform: scaleX(0.82); }
    50% { opacity: 1; transform: scaleX(1); }
  }
  .enter-plus { animation-name: breathFade; }
  @keyframes breathFade {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  /* ---------- visual novel ---------- */
  #screen-vn { background: #050607; }
  .vn-bg { position: absolute; inset: 0; overflow: hidden; }
  .vn-layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .vn-layer.is-front { opacity: 1; z-index: 1; }
  .vn-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 35%;
    filter: brightness(0.78) saturate(0.86);
    transform: scale(1.03);
  }
  .vn-layer.is-front img { animation: ken 18s ease-out forwards; }
  @keyframes ken {
    from { transform: scale(1.02); }
    to { transform: scale(1.1); }
  }
  .vn-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5, 6, 7, 0.55), transparent 16%),
      radial-gradient(ellipse at center, transparent 45%, rgba(5, 6, 7, 0.38) 100%);
  }
  .vn-progress {
    position: absolute;
    z-index: 5;
    top: calc(16px + var(--safe-t));
    left: 16px;
    right: 118px;
  }
  .vn-ruler {
    position: relative;
    height: 9px;
    background: repeating-linear-gradient(90deg, rgba(140, 118, 76, 0.85) 0 1px, transparent 1px 6px);
  }
  .vn-ruler-fill {
    position: absolute;
    left: 0;
    top: 6px;
    height: 1px;
    width: 0;
    background: var(--ink);
    transition: width 0.45s ease;
  }
  .vn-count {
    display: block;
    margin-top: 6px;
    font-family: var(--caps);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink);
  }
  .vn-dialog {
    position: absolute;
    z-index: 4;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 46%;
    padding: 22% 22px calc(26px + var(--safe-b));
    background: linear-gradient(to bottom, rgba(10, 12, 14, 0) 0%, rgba(10, 12, 14, 0.55) 24%, rgba(10, 12, 14, 0.94) 52%, #0A0C0E 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .vn-speaker {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-family: var(--caps);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--brass);
  }
  .vn-speaker::after {
    content: "";
    width: 42px;
    height: 1px;
    background: var(--brass);
  }
  .vn-speaker:empty { display: none; }
  .vn-text {
    min-height: 6.6em;
    font-size: 16.5px;
    line-height: 1.75;
    color: var(--ink);
  }
  .vn-text .ch { animation: ink 0.16s ease both; }
  .vn-text.is-instant .ch { animation: none; }
  @keyframes ink {
    from { opacity: 0; filter: blur(1.6px); }
    to { opacity: 1; filter: blur(0); }
  }
  .vn-text.is-done::after {
    content: "";
    display: inline-block;
    width: 8px;
    height: 1px;
    margin-left: 8px;
    background: var(--brass);
    vertical-align: middle;
    animation: breathFade 1.3s ease-in-out infinite;
  }
  .vn-hint {
    margin-top: 12px;
    font-family: var(--caps);
    font-size: 9px;
    letter-spacing: 0.28em;
    color: var(--brass);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .vn-text.is-done ~ .vn-hint { opacity: 0.85; }

  /* ---------- hub ---------- */
  #screen-hub { background: var(--obsidian); }
  .hub-atmos, .climate-vig {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hub-atmos { z-index: 0; overflow: hidden; }
  .hub-scroll {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(214, 209, 196, 0.03) 28px);
  }
  .hub-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .climate-vig { z-index: 4; transition: background 0.35s ease, box-shadow 0.35s ease; }
  #stage[data-climate="wet"] .climate-vig {
    background: radial-gradient(ellipse at center, transparent 46%, rgba(30, 77, 84, 0.28) 82%, rgba(6, 10, 12, 0.72) 100%);
    box-shadow: inset 0 0 48px rgba(122, 28, 36, 0.12);
  }
  #stage[data-climate="dry"] .climate-vig {
    background: radial-gradient(ellipse at center, transparent 48%, rgba(143, 67, 41, 0.26) 82%, rgba(12, 7, 5, 0.72) 100%);
    box-shadow: inset 0 0 42px rgba(184, 111, 40, 0.12);
  }

  .mote {
    position: absolute;
    bottom: -12px;
    opacity: 0;
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .mote.mist {
    background: rgba(176, 214, 210, 0.55);
    border-radius: 50%;
    filter: blur(1px);
  }
  .mote.mist.wide {
    background: radial-gradient(ellipse, rgba(30, 77, 84, 0.45), transparent 70%);
    filter: blur(8px);
    border-radius: 50%;
  }
  .mote.ash { background: #B86F28; box-shadow: 0 0 5px rgba(184, 111, 40, 0.8); }
  #stage[data-climate="wet"] .mote.ash { display: none; }
  #stage[data-climate="dry"] .mote.mist { display: none; }
  @keyframes rise {
    0% { transform: translate3d(0, 8px, 0); opacity: 0; }
    14% { opacity: 0.8; }
    100% { transform: translate3d(var(--dx, 12px), -105dvh, 0); opacity: 0; }
  }

  .hub-header {
    position: sticky;
    top: 0;
    z-index: 6;
    display: grid;
    grid-template-columns: 74px 1fr 46px;
    align-items: end;
    gap: 4px;
    min-height: calc(54px + var(--safe-t));
    padding: calc(8px + var(--safe-t)) 4px 0 12px;
    background: #0A0C0E;
    border-bottom: 1px solid rgba(140, 118, 76, 0.35);
  }
  .brand { padding-bottom: 8px; line-height: 1; }
  .brand-w, .brand-d {
    font-family: var(--caps);
    font-size: 15px;
    letter-spacing: 0.08em;
  }
  .brand-amp {
    font-family: var(--latin);
    font-style: italic;
    color: var(--brass);
    margin: 0 1px;
    font-size: 13px;
  }
  .brand small {
    display: block;
    margin-top: 3px;
    font-family: var(--caps);
    font-size: 7px;
    letter-spacing: 0.18em;
    color: var(--brass);
  }
  .tabs {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-self: stretch;
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 1px;
    padding: 6px 2px 9px;
    color: var(--ink-faint);
  }
  .tab b {
    font-family: var(--display-ko);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0;
  }
  .tab small {
    font-family: var(--caps);
    font-size: 8px;
    letter-spacing: 0.16em;
  }
  .tab[aria-selected="true"] {
    color: var(--ink);
    background: #121518;
  }
  .tab-bar {
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 50%;
    height: 2px;
    background: var(--brass);
    transform: translateX(0);
    transition: transform 0.35s cubic-bezier(.2, .8, .2, 1);
  }
  .tabs[data-tab="archive"] .tab-bar { transform: translateX(100%); }
  .view { display: none; padding-bottom: calc(28px + var(--safe-b)); }
  .view.is-on { display: block; }
  #view-archive { padding-bottom: calc(108px + var(--safe-b)); }

  /* lever */
  .lever-block { padding: 16px 16px 6px; }
  .lever-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }
  .lever-meta .caps { color: var(--brass); font-size: 9px; }
  .lever-meta .latin { font-size: 15px; color: var(--ink); }
  .lever-mech {
    position: relative;
    border-top: 1px solid var(--brass-line);
    border-bottom: 1px solid rgba(140, 118, 76, 0.25);
    padding-top: 8px;
  }
  .lever-mech.is-clack { animation: clack 0.28s ease; }
  @keyframes clack {
    0% { transform: translateY(0); }
    40% { transform: translateY(1px); }
    100% { transform: translateY(0); }
  }
  .lever-ruler {
    height: 10px;
    margin: 0 8px;
    background: repeating-linear-gradient(90deg, var(--brass) 0 1px, transparent 1px 9px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .lever-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 86px minmax(0, 1fr);
    align-items: end;
    gap: 2px;
    min-height: 124px;
  }
  .scale-pan {
    position: relative;
    z-index: 1;
    pointer-events: none;
    transform-origin: 50% 12%;
    transition: transform 0.46s cubic-bezier(.18, 1.25, .28, 1), opacity 0.35s ease;
  }
  .scale-svg { display: block; width: 100%; height: auto; overflow: visible; }
  #stage[data-climate="wet"] .scale-wet { transform: translateY(7px); }
  #stage[data-climate="wet"] .scale-dry { transform: translateY(-5px); opacity: 0.5; }
  #stage[data-climate="dry"] .scale-dry { transform: translateY(7px); }
  #stage[data-climate="dry"] .scale-wet { transform: translateY(-5px); opacity: 0.5; }
  .silver-sheen {
    transform-box: fill-box;
    animation: silverSweep 8.5s ease-in-out infinite;
  }
  @keyframes silverSweep {
    0%, 100% { transform: translateX(6px); opacity: 0.22; }
    50% { transform: translateX(78px); opacity: 0.55; }
  }
  .lever-btn {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    height: 118px;
  }
  .lever-pivot {
    position: absolute;
    left: 50%;
    bottom: 14px;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    border: 1px solid var(--brass);
    border-radius: 50%;
    background: var(--obsidian);
    z-index: 2;
  }
  .lever-arm {
    position: absolute;
    left: 50%;
    bottom: 20px;
    width: 4px;
    height: 76px;
    margin-left: -2px;
    background: #8C764C;
    transform-origin: 50% 100%;
    z-index: 1;
    transition: transform 0.46s cubic-bezier(.18, 1.25, .28, 1);
  }
  #stage[data-climate="wet"] .lever-arm { transform: rotate(-36deg); }
  #stage[data-climate="dry"] .lever-arm { transform: rotate(36deg); }
  .lever-knob {
    position: absolute;
    left: 50%;
    top: -10px;
    width: 30px;
    height: 16px;
    transform: translateX(-50%);
    background: var(--iron);
    border: 1px solid var(--brass);
    clip-path: polygon(3px 0, calc(100% - 3px) 0, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 0 calc(100% - 3px), 0 3px);
  }
  .lever-knob::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 4px;
    top: 5px;
    height: 1px;
    background: var(--brass);
  }
  .lever-note {
    margin: 8px 2px 0;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-dim);
  }

  /* dossier cards */
  .dossier-list { padding: 8px 0 0; }
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 10px;
    width: calc(100% - 28px);
    margin: 0 14px 10px;
    padding: 8px 12px 8px 8px;
    text-align: left;
    background: #101316;
    border: 1px solid var(--brass-line);
    clip-path: var(--chamfer);
    animation: riseIn 0.42s ease both;
  }
  .card:nth-child(2) { animation-delay: 40ms; }
  .card:nth-child(3) { animation-delay: 80ms; }
  .card:nth-child(4) { animation-delay: 120ms; }
  .card:nth-child(5) { animation-delay: 160ms; }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 1px;
    background: var(--climate);
  }
  .portrait-slot {
    position: relative;
    width: 96px;
    height: 128px;
  }
  .portrait-slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: grayscale(1) contrast(1.08) brightness(0.9);
    transition: filter 0.45s ease;
  }
  .card:hover img,
  .card:active img,
  .card:focus-visible img,
  .card.is-awake img {
    filter: none;
  }
  .card-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    padding: 4px 0;
  }
  .card-no { color: var(--brass); font-size: 9px; }
  .card-name {
    margin-top: 4px;
    font-size: 20px;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }
  .card-alias {
    margin: 1px 0 8px;
    font-size: 16px;
    color: var(--ink-dim);
    line-height: 1.2;
  }
  .card-pulse, .spec-pulse {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .card-pulse .caps, .spec-grade { color: var(--ink-dim); font-size: 9px; letter-spacing: 0.14em; }
  .ticks { display: flex; align-items: flex-end; gap: 3px; height: 14px; }
  .ticks i {
    display: block;
    width: 2px;
    height: 7px;
    background: rgba(140, 118, 76, 0.35);
  }
  .ticks i.is-major { height: 12px; }
  .ticks i.is-on { background: var(--climate); }

  .persona-banner {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: calc(100% - 28px);
    margin: 12px 14px 88px;
    padding: 14px 14px 13px;
    text-align: left;
    border: 1px solid var(--brass-line);
    background:
      linear-gradient(var(--climate), var(--climate)) left / 1px 100% no-repeat,
      #101316;
    clip-path: var(--chamfer);
  }
  .persona-banner .caps { color: var(--brass); }
  .persona-label {
    font-family: var(--display-ko);
    font-size: 16px;
  }
  .persona-label em {
    font-style: normal;
    color: var(--brass);
    margin-left: 6px;
  }

  /* sheet */
  .sheet {
    position: absolute;
    inset: 0;
    z-index: 24;
    display: flex;
    flex-direction: column;
    background: var(--obsidian);
    transform: translateY(104%);
    transition: transform 0.52s cubic-bezier(.22, .8, .28, 1);
    pointer-events: none;
  }
  .sheet.is-open { transform: none; pointer-events: auto; }
  .sheet-bar {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(58px + var(--safe-t));
    padding: calc(12px + var(--safe-t)) 58px 10px;
    background: #0A0C0E;
    border-bottom: 1px solid rgba(140, 118, 76, 0.35);
    font-family: var(--caps);
    letter-spacing: 0.18em;
    font-size: 10px;
    color: var(--brass);
  }
  #sheet-close {
    position: absolute;
    z-index: 3;
    left: 8px;
    top: calc(8px + var(--safe-t));
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    font-family: var(--caps);
    font-size: 32px;
    line-height: 1;
    color: #E9FFFC;
    text-shadow:
      0 0 6px rgba(150, 255, 244, 0.95),
      0 0 14px rgba(70, 220, 210, 0.72);
  }
  #sheet-close::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(130, 245, 232, 0.72) 0%, rgba(30, 160, 150, 0.28) 42%, rgba(30, 77, 84, 0) 72%);
    filter: blur(7px);
    pointer-events: none;
  }
  #stage[data-climate="dry"] #sheet-close {
    color: #FFF1E4;
    text-shadow:
      0 0 6px rgba(255, 186, 110, 0.95),
      0 0 14px rgba(220, 110, 40, 0.7);
  }
  #stage[data-climate="dry"] #sheet-close::before {
    background: radial-gradient(circle, rgba(255, 176, 90, 0.7) 0%, rgba(184, 92, 32, 0.28) 42%, rgba(143, 67, 41, 0) 72%);
  }
  .sheet-body {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .editorial {
    position: relative;
    height: 58dvh;
    min-height: 320px;
  }
  .editorial::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30%;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent, #0A0C0E);
  }
  .standing-slot {
    position: absolute;
    right: 0;
    bottom: -5%;
    width: 74%;
    height: 112%;
    z-index: 1;
  }
  .standing-slot img,
  .standing-slot .ph {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: right bottom;
    -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 18%, #000 90%, transparent 100%);
    mask-image: linear-gradient(to top, transparent 0%, #000 18%, #000 90%, transparent 100%);
  }
  .ed-caption {
    position: absolute;
    z-index: 2;
    left: 16px;
    top: 14px;
    max-width: 58%;
    text-shadow: 0 2px 14px #000, 0 0 2px #000;
    pointer-events: none;
  }
  .ed-caption .caps { color: var(--brass); }
  .ed-name { margin-top: 6px; font-size: 26px; line-height: 1.25; }
  .ed-alias { margin-top: 2px; font-size: 18px; color: rgba(214, 209, 196, 0.86); }
  .stamp {
    position: absolute;
    z-index: 3;
    left: 12px;
    bottom: 16px;
    width: 108px;
    transform: rotate(-8deg);
    filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.55));
  }
  .stamp.is-boing { animation: boing 0.48s ease; }
  @keyframes boing {
    0% { transform: rotate(-8deg) scale(1); }
    35% { transform: rotate(-1deg) scale(1.07); }
    68% { transform: rotate(-11deg) scale(0.98); }
    100% { transform: rotate(-8deg) scale(1); }
  }
  .stamp-photo {
    position: relative;
    display: block;
    height: 136px;
    background: #141210;
    border: 1px dashed rgba(140, 118, 76, 0.8);
    clip-path: var(--chamfer-sm);
  }
  .stamp-photo img { width: 100%; height: 100%; object-fit: contain; }
  .bubble {
    position: absolute;
    left: calc(100% - 6px);
    bottom: 62%;
    width: 148px;
    padding: 8px 9px;
    background: #121418;
    border: 1px solid var(--brass-line);
    color: var(--ink);
    font-size: 12px;
    line-height: 1.45;
    text-align: left;
    opacity: 0;
    transform: translateY(4px);
    pointer-events: none;
    clip-path: var(--chamfer-sm);
  }
  .bubble.is-on {
    opacity: 1;
    left: calc(100% - 36px);
    width: 224px;
    transform: none;
    transition: 0.22s ease;
  }
  .bubble-en, .bubble-ko { display: block; }
  .bubble-ko { margin-top: 4px; font-style: italic; }

  .identity { position: relative; z-index: 2; padding: 4px 16px calc(108px + var(--safe-b)); }
  .face-switch {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid rgba(140, 118, 76, 0.28);
  }
  .face-switch button {
    padding: 12px 4px 11px;
    font-family: var(--display-ko);
    font-size: 13px;
    color: var(--ink-faint);
  }
  .face-switch button[aria-pressed="true"] { color: var(--ink); }
  .face-bar {
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 50%;
    height: 1px;
    background: var(--brass);
    transition: transform 0.3s ease;
  }
  .face-switch[data-show="rumor"] .face-bar { transform: translateX(100%); }
  .faces[data-show="official"] .face-rumor,
  .faces[data-show="rumor"] .face-official { display: none; }
  .face { padding-top: 14px; animation: ink 0.35s ease; }
  .spec { margin: 0; }
  .spec > div {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 8px;
    padding: 8px 0;
    border-top: 1px solid rgba(140, 118, 76, 0.22);
    align-items: baseline;
  }
  .spec dt {
    font-family: var(--caps);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--brass);
  }
  .spec dd { margin: 0; font-size: 15px; line-height: 1.45; }
  .em-race {
    font-family: var(--display-ko);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.02em;
  }
  .em-pulse {
    margin-left: 8px;
    font-family: var(--caps);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--climate);
  }
  .em-grade {
    margin-left: 6px;
    font-family: var(--serif);
    font-size: 12px;
    color: var(--ink-dim);
  }
  .spec dd.em-job {
    font-family: var(--alias);
    font-style: italic;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.35;
    color: var(--ink);
  }
  .spec dd.em-measure {
    font-family: var(--latin);
    font-size: 18px;
    letter-spacing: 0.01em;
  }
  .em-note {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--ink-dim);
  }
  .bio { margin-top: 16px; }
  .bio-kicker { display: block; margin-bottom: 8px; color: var(--brass); }
  .bio p + p { margin-top: 12px; }
  .bio p.bio-lead {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.85;
    color: var(--ink);
  }
  .bio p.bio-aside {
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.75;
    color: rgba(214, 209, 196, 0.66);
  }
  .bio p.bio-barbed {
    font-family: var(--display-ko);
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.7;
    color: var(--ink);
    padding: 2px 0 2px 12px;
    border-left: 1px solid var(--brass);
  }
  .em-hit {
    font-family: var(--display-ko);
    font-weight: 700;
    font-style: normal;
    letter-spacing: -0.02em;
    background-image: linear-gradient(transparent 64%, rgba(140, 118, 76, 0.42) 0);
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .em-say {
    font-family: var(--alias), var(--serif);
    font-style: italic;
    font-weight: 600;
  }
  .em-term {
    font-weight: 700;
    color: var(--ink);
  }
  .quote {
    margin: 16px 0 0;
    padding: 0;
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
  }
  .quote::before {
    content: "\201C";
    font-family: var(--latin);
    color: var(--brass);
    font-size: 28px;
    line-height: 0;
    margin-right: 4px;
    vertical-align: -6px;
  }
  .rumor-kicker { color: var(--wet-hot); margin-bottom: 8px; }
  .face-rumor p { font-size: 15px; line-height: 1.75; color: rgba(214, 209, 196, 0.88); margin-top: 10px; }

  /* archive */
  .arch-banner {
    position: relative;
    margin: 0;
    height: 210px;
    overflow: hidden;
    border-bottom: 1px solid rgba(140, 118, 76, 0.35);
  }
  .arch-photo { position: absolute; inset: 0; }
  .arch-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.48) saturate(0.8);
  }
  .arch-banner figcaption {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 14px;
    z-index: 1;
  }
  .arch-banner .caps { color: var(--brass); }
  .arch-banner strong {
    display: block;
    margin-top: 4px;
    font-family: var(--display-ko);
    font-size: 26px;
    font-weight: 500;
  }
  .arch-banner .latin { display: block; margin-top: 2px; color: var(--ink-dim); font-size: 14px; }
  .arch-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(10, 12, 14, 0.15), rgba(10, 12, 14, 0.2) 40%, #0A0C0E);
    pointer-events: none;
  }
  .arch-lead {
    padding: 14px 16px 4px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-dim);
  }
  .arch-lead del, .acc-inner del {
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    color: rgba(214, 209, 196, 0.48);
  }
  .acc-inner strong { font-weight: 700; color: var(--ink); }
  .acc-inner p em { font-style: italic; }
  .acc { border-top: 1px solid rgba(140, 118, 76, 0.28); }
  .acc:last-child { border-bottom: 1px solid rgba(140, 118, 76, 0.28); margin-bottom: 88px; }
  .acc-head {
    width: 100%;
    display: grid;
    grid-template-columns: 36px 1fr 16px;
    gap: 8px;
    align-items: center;
    padding: 14px 16px;
    text-align: left;
  }
  .acc-no {
    font-family: var(--caps);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--brass);
  }
  .acc-head b {
    display: block;
    font-family: var(--display-ko);
    font-weight: 500;
    font-size: 16px;
  }
  .acc-head small {
    display: block;
    margin-top: 2px;
    font-family: var(--caps);
    font-size: 8px;
    letter-spacing: 0.16em;
    color: var(--ink-faint);
  }
  .acc-mark { width: 11px; height: 11px; position: relative; }
  .acc-mark::before, .acc-mark::after {
    content: "";
    position: absolute;
    background: var(--brass);
  }
  .acc-mark::before { left: 0; right: 0; top: 5px; height: 1px; }
  .acc-mark::after { top: 0; bottom: 0; left: 5px; width: 1px; }
  .acc.is-open .acc-mark { transform: rotate(45deg); }
  .acc-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.42s ease;
  }
  .acc.is-open .acc-body { grid-template-rows: 1fr; }
  .acc-inner { overflow: hidden; }
  .acc-inner p, .acc-inner .grade-list, .acc-inner .lex {
    padding-left: 16px;
    padding-right: 16px;
  }
  .acc-inner p {
    font-size: 15px;
    line-height: 1.75;
    color: rgba(214, 209, 196, 0.9);
    margin: 0 0 12px;
  }
  .acc-inner p:first-child { margin-top: 2px; }
  .grade-list { list-style: none; margin: 0 0 14px; padding: 0 16px; }
  .grade-list li {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) max-content;
    gap: 6px;
    align-items: start;
    padding: 6px 0;
    border-top: 1px solid rgba(140, 118, 76, 0.22);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .grade-list span:first-child { font-family: var(--caps); color: var(--brass); font-size: 11px; padding-top: 1px; }
  .grade-list span:nth-child(2) { min-width: 0; overflow-wrap: anywhere; word-break: keep-all; }
  .grade-list em {
    font-family: var(--alias);
    font-style: italic;
    font-size: 11px;
    color: var(--ink-dim);
    white-space: nowrap;
    padding-top: 1px;
  }
  .place { margin: 0 0 12px; padding: 0 16px; }
  .place b {
    display: block;
    margin-bottom: 3px;
    font-family: var(--display-ko);
    font-weight: 500;
    font-size: 14px;
    color: var(--brass);
  }
  .place b::before { content: "· "; }
  .place p { margin: 0; padding: 0; }
  .lex { margin: 0 0 16px; }
  .lex dt {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: baseline;
    font-family: var(--display-ko);
    font-size: 15px;
    margin-top: 12px;
  }
  .lex dt em {
    font-family: var(--alias);
    font-style: italic;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .lex dd {
    margin: 3px 0 0;
    font-size: 14px;
    line-height: 1.65;
    color: rgba(214, 209, 196, 0.82);
  }

  /* fab */
  .fab {
    position: absolute;
    z-index: 30;
    right: 12px;
    bottom: calc(14px + var(--safe-b));
    width: 76px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  #stage[data-screen="hub"] .fab { opacity: 1; pointer-events: auto; transform: none; }
  #stage[data-pulse="open"] .fab,
  #stage[data-sheet="open"] .fab { opacity: 0; pointer-events: none; }
  .fab-svg { width: 58px; height: 58px; overflow: visible; }
  .fab-needle { transform-origin: 32px 32px; transform-box: view-box; animation: sway 2.6s ease-in-out infinite alternate; }
  @keyframes sway {
    from { transform: rotate(-16deg); }
    to { transform: rotate(12deg); }
  }
  .fab-label {
    font-family: var(--caps);
    font-size: 8px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
  }

  /* pulse overlay */
  .pulse {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }
  .pulse.is-open { pointer-events: auto; }
  .pulse-dim {
    position: absolute;
    inset: 0;
    background: rgba(5, 6, 7, 0.62);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .pulse.is-open .pulse-dim { opacity: 1; }
  .pulse-panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #0C0F12;
    color: var(--ink);
    transform: translateY(104%);
    transition: transform 0.58s cubic-bezier(.2, .78, .2, 1);
    clip-path: polygon(0 16px, 16px 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background-image:
      radial-gradient(circle at 12px 18px, var(--brass) 0 1.4px, transparent 1.6px),
      radial-gradient(circle at calc(100% - 12px) 18px, var(--brass) 0 1.4px, transparent 1.6px);
    background-repeat: no-repeat;
  }
  .pulse.is-open .pulse-panel { transform: none; }
  .pulse-top {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: calc(10px + var(--safe-t)) 16px 8px;
    background: #0C0F12;
    border-bottom: 1px solid rgba(140, 118, 76, 0.28);
  }
  .pulse-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-right: 40px;
  }
  .pulse-head .caps { color: var(--brass); }
  .pulse-sub {
    margin-top: 3px;
    font-family: var(--display-ko);
    font-size: 16px;
  }
  .pulse-close {
    position: absolute;
    top: calc(8px + var(--safe-t));
    right: 50px;
    width: 44px;
    height: 36px;
    font-size: 22px;
    line-height: 1;
    color: var(--ink);
  }
  .gauge-wrap { display: flex; justify-content: center; margin-top: 2px; }
  .gauge-svg { width: min(100%, 280px); height: auto; }
  .pulse-readout {
    text-align: center;
    font-family: var(--caps);
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--ink-dim);
    margin: 0 0 6px;
  }
  #pulse-body { padding: 8px 16px calc(24px + var(--safe-b)); }
  .q-kicker { color: var(--brass); margin: 12px 0 8px; }
  .q-meter {
    height: 2px;
    margin: 0 0 12px;
    background: rgba(140, 118, 76, 0.28);
  }
  .q-meter span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--brass);
  }
  .q-prompt {
    font-family: var(--display-ko);
    font-size: 20px;
    line-height: 1.45;
    font-weight: 500;
    margin-bottom: 16px;
  }
  .q-choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    align-items: start;
    width: 100%;
    text-align: left;
    padding: 12px 12px;
    border: 1px solid var(--brass-line);
    background: #14181b;
    clip-path: var(--chamfer-sm);
    line-height: 1.5;
    font-size: 14.5px;
  }
  .choice-idx {
    font-family: var(--caps);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--brass);
    padding-top: 3px;
  }
  .choice.is-picked { border-color: var(--ink); background: #1a1e22; }

  .cert {
    position: relative;
    margin-top: 12px;
    padding: 16px 14px 14px;
    border: 1px solid var(--brass-line);
    background: #101316;
    clip-path: var(--chamfer);
  }
  .cert-kicker { color: var(--brass); }
  .cert h2 { font-size: 24px; margin: 6px 0 2px; }
  .cert .latin { color: var(--ink-dim); font-size: 15px; }
  .seal {
    position: absolute;
    top: 10px;
    right: 8px;
    width: 86px;
    height: 86px;
    opacity: 0;
    transform: rotate(-18deg) scale(1.25);
  }
  .cert.is-in .seal { animation: stampIn 0.7s cubic-bezier(.2, 1.3, .3, 1) 0.05s forwards; }
  @keyframes stampIn {
    0% { opacity: 0; transform: rotate(-24deg) scale(1.4); }
    65% { opacity: 1; transform: rotate(-12deg) scale(0.96); }
    100% { opacity: 0.95; transform: rotate(-14deg) scale(1); }
  }
  .cert-photo {
    position: relative;
    width: 150px;
    height: 200px;
    margin: 16px auto 8px;
  }
  .cert-photo img { width: 100%; height: 100%; object-fit: contain; }
  .cert-npc { text-align: center; }
  .cert-npc .alias { font-size: 18px; color: var(--ink-dim); }
  .cert-npc h3 { font-size: 20px; margin-top: 2px; }
  .cert .spec { margin-top: 12px; }
  .trait {
    margin-top: 14px;
    font-size: 15px;
    line-height: 1.7;
  }
  .trait.quirk { margin-top: 8px; color: var(--ink-dim); }
  .cert .spec > div { grid-template-columns: 64px 1fr; }
  .copy-preview {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid rgba(140, 118, 76, 0.28);
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-dim);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .cert-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .text-btn {
    min-height: 46px;
    border: 1px solid var(--brass-line);
    clip-path: var(--chamfer-sm);
    font-family: var(--display-ko);
    font-size: 14px;
    background: #161a1d;
  }
  .text-btn.ghost { background: transparent; color: var(--ink-dim); }

  /* modal */
  .modal {
    position: absolute;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal.is-open { opacity: 1; pointer-events: auto; }
  .modal-dim {
    position: absolute;
    inset: 0;
    background: rgba(5, 6, 7, 0.55);
  }
  .modal-card {
    position: relative;
    width: min(100%, 320px);
    padding: 22px 18px 16px;
    background: rgba(10, 12, 14, 0.78);
    -webkit-backdrop-filter: blur(10px) saturate(0.8);
    backdrop-filter: blur(10px) saturate(0.8);
    border: 1px solid var(--brass-line);
    clip-path: var(--chamfer);
  }
  .modal-card .caps { color: var(--brass); }
  .modal-card h2 {
    margin: 10px 0 16px;
    font-size: 20px;
    line-height: 1.45;
    font-weight: 500;
  }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }
  .modal-actions .text-btn.go { border-color: rgba(122, 28, 36, 0.85); }

  .toast {
    position: absolute;
    z-index: 96;
    left: 16px;
    right: 16px;
    bottom: calc(18px + var(--safe-b));
    padding: 12px 14px;
    background: #14181b;
    border: 1px solid var(--brass-line);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    clip-path: var(--chamfer-sm);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .toast.is-on { opacity: 1; transform: none; }

  .ph {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background:
      linear-gradient(rgba(140, 118, 76, 0.35), rgba(140, 118, 76, 0.35)) center / 1px 46% no-repeat,
      linear-gradient(rgba(140, 118, 76, 0.35), rgba(140, 118, 76, 0.35)) center / 46% 1px no-repeat,
      #101316;
    border: 1px solid rgba(140, 118, 76, 0.4);
    pointer-events: none;
  }
  .ph svg { width: 46%; height: auto; max-height: 58%; }
  .ph-label {
    font-family: var(--caps);
    font-size: 8px;
    letter-spacing: 0.14em;
    text-align: center;
    color: var(--ink-dim);
    padding: 0 6px;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
  .noscript {
    position: absolute;
    inset: 0;
    z-index: 120;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0A0C0E;
    text-align: center;
  }

  @media (max-height: 700px) {
    .hero-mark { width: min(78%, 320px); }
    .land-center { top: 44%; }
    .editorial { min-height: 280px; height: 52dvh; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<!-- ============================================================
     [SECTION 2: HTML]
     반복되는 인물 카드, 연감 본문, 진단 문항은
     SECTION 3 데이터를 SECTION 4가 여기에 채운다.
     ============================================================ -->
<div id="void">
  <div id="stage" data-climate="wet" data-screen="landing">

    <svg class="grain grain-paper" aria-hidden="true">
      <filter id="grainPaper" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" stitchTiles="stitch" seed="7"/>
        <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainPaper)"/>
    </svg>
    <svg class="grain grain-fine" aria-hidden="true">
      <filter id="grainFine" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="3"/>
        <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.85 0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grainFine)"/>
    </svg>

    <button type="button" id="audio-btn" class="audio-btn is-off" aria-pressed="false" aria-label="배경음 재생">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 12.5 H10.5 L16.5 7.5 V24.5 L10.5 19.5 H6 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path class="wave" d="M20 12.5 C22.2 14.2 22.2 17.8 20 19.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path class="wave" d="M22.8 9.2 C26.4 12.2 26.4 19.8 22.8 22.8" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path class="slash" d="M7 26 L26 6" fill="none" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
    <button type="button" id="skip-btn" class="skip-btn"><span>SKIP</span></button>

    <section id="screen-landing" class="screen is-on" aria-hidden="false">
      <div class="land-bg">
        <img id="land-bg-img" alt="">
        <div class="land-shade"></div>
        <div class="fog" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>
      <div class="reg"><span>FILE 00</span><span>THRESHOLD</span></div>
      <p class="spine">VEL-ARCA BASIN ARCHIVE</p>
      <div class="land-center">
        <div class="hero-mark">
          <svg id="reticle-svg" class="reticle-svg" viewBox="0 0 300 300" aria-hidden="true"></svg>
          <div class="logo-slot"><img id="logo-img" alt="WET AND DRY"></div>
          <svg class="flourish tl" viewBox="0 0 48 48" aria-hidden="true"><path d="M2 38 C2 12 12 2 38 2" fill="none" stroke="currentColor" stroke-width="0.7"/><path d="M8 38 C8 16 16 8 38 8" fill="none" stroke="currentColor" stroke-width="0.4"/><circle cx="2" cy="38" r="1.15" fill="currentColor"/></svg>
          <svg class="flourish tr" viewBox="0 0 48 48" aria-hidden="true"><path d="M2 38 C2 12 12 2 38 2" fill="none" stroke="currentColor" stroke-width="0.7"/><path d="M8 38 C8 16 16 8 38 8" fill="none" stroke="currentColor" stroke-width="0.4"/><circle cx="2" cy="38" r="1.15" fill="currentColor"/></svg>
          <svg class="flourish br" viewBox="0 0 48 48" aria-hidden="true"><path d="M2 38 C2 12 12 2 38 2" fill="none" stroke="currentColor" stroke-width="0.7"/><path d="M8 38 C8 16 16 8 38 8" fill="none" stroke="currentColor" stroke-width="0.4"/><circle cx="2" cy="38" r="1.15" fill="currentColor"/></svg>
          <svg class="flourish bl" viewBox="0 0 48 48" aria-hidden="true"><path d="M2 38 C2 12 12 2 38 2" fill="none" stroke="currentColor" stroke-width="0.7"/><path d="M8 38 C8 16 16 8 38 8" fill="none" stroke="currentColor" stroke-width="0.4"/><circle cx="2" cy="38" r="1.15" fill="currentColor"/></svg>
        </div>
      </div>
      <div class="enter-wrap">
        <p class="land-file">Plate 00 · Restricted Circulation</p>
        <button type="button" id="enter-btn" class="enter">
          <span class="enter-plus" aria-hidden="true">+</span>
          <span class="enter-label">TOUCH TO ENTER THE BASIN</span>
          <span class="enter-rule a"></span>
          <span class="enter-rule b"></span>
        </button>
      </div>
    </section>

    <section id="screen-vn" class="screen" aria-hidden="true">
      <div class="vn-bg">
        <div class="vn-layer" id="vn-layer-a"><img id="vn-bg-a" alt=""></div>
        <div class="vn-layer" id="vn-layer-b"><img id="vn-bg-b" alt=""></div>
      </div>
      <div class="vn-progress">
        <div class="vn-ruler"><span class="vn-ruler-fill" id="vn-fill"></span></div>
        <span class="vn-count" id="vn-count">01 / 06</span>
      </div>
      <div class="vn-dialog" id="vn-dialog">
        <p class="vn-speaker" id="vn-speaker"></p>
        <p class="vn-text" id="vn-text"></p>
        <p class="vn-hint">TOUCH</p>
      </div>
    </section>

    <section id="screen-hub" class="screen" aria-hidden="true">
      <div class="hub-atmos" id="particle-field" aria-hidden="true"></div>
      <div class="hub-scroll" id="hub-scroll">
        <header class="hub-header">
          <div class="brand" aria-label="WET and DRY">
            <span class="brand-w">W</span><span class="brand-amp">&amp;</span><span class="brand-d">D</span>
            <small>VEL-ARCA</small>
          </div>
          <div class="tabs" id="tabs" role="tablist" data-tab="dossier">
            <button type="button" class="tab" id="tab-dossier" role="tab" aria-selected="true" aria-controls="view-dossier">
              <b>인물 대장</b><small>DOSSIER</small>
            </button>
            <button type="button" class="tab" id="tab-archive" role="tab" aria-selected="false" aria-controls="view-archive">
              <b>분지 연감</b><small>ARCHIVE</small>
            </button>
            <span class="tab-bar" aria-hidden="true"></span>
          </div>
          <div class="header-audio-slot" aria-hidden="true"></div>
        </header>

        <div id="view-dossier" class="view is-on" role="tabpanel">
          <div class="lever-block">
            <div class="lever-meta">
              <span class="caps">Climate Register</span>
              <span class="latin" id="climate-read">Humiditas</span>
            </div>
            <div class="lever-mech" id="lever-mech">
              <div class="lever-ruler" aria-hidden="true"></div>
              <div class="lever-stage">
                <div class="scale-pan scale-wet" aria-hidden="true">
                  <svg class="scale-svg" viewBox="0 0 160 118">
                    <defs>
                      <linearGradient id="wetMetal" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#6A7278"/>
                        <stop offset="0.16" stop-color="#EEF3F5"/>
                        <stop offset="0.4" stop-color="#C5CED3"/>
                        <stop offset="0.68" stop-color="#8B959C"/>
                        <stop offset="1" stop-color="#D8DEE2"/>
                      </linearGradient>
                      <linearGradient id="wetType" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#F7FAFB"/>
                        <stop offset="0.38" stop-color="#D4DCE0"/>
                        <stop offset="0.74" stop-color="#8E989F"/>
                        <stop offset="1" stop-color="#F0F4F6"/>
                      </linearGradient>
                      <linearGradient id="wetSheen" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" stop-color="#F7FAFB" stop-opacity="0"/>
                        <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.9"/>
                        <stop offset="1" stop-color="#F7FAFB" stop-opacity="0"/>
                      </linearGradient>
                      <clipPath id="wetWeightClip">
                        <path d="M68 44 H92 V54 L116 70 L122 104 H38 L44 70 L68 54 Z"/>
                      </clipPath>
                      <filter id="wetGrain" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
                        <feTurbulence type="fractalNoise" baseFrequency="0.025 0.95" numOctaves="2" seed="4" stitchTiles="stitch" result="brush"/>
                        <feColorMatrix in="brush" type="saturate" values="0" result="gray"/>
                        <feComponentTransfer in="gray" result="lines">
                          <feFuncA type="linear" slope="0.42"/>
                        </feComponentTransfer>
                        <feBlend in="SourceGraphic" in2="lines" mode="overlay" result="brushed"/>
                        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" stitchTiles="stitch" result="dust"/>
                        <feColorMatrix in="dust" type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.89  0 0 0 0 0.92  0 0 0 0.2 0" result="mist"/>
                        <feBlend in="brushed" in2="mist" mode="soft-light" result="full"/>
                        <feComposite in="full" in2="SourceAlpha" operator="in"/>
                      </filter>
                      <filter id="wetFace" x="-8%" y="-20%" width="116%" height="150%" color-interpolation-filters="sRGB">
                        <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="8" stitchTiles="stitch" result="grain"/>
                        <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.93  0 0 0 0 0.95  0 0 0 0.18 0" result="veil"/>
                        <feBlend in="SourceGraphic" in2="veil" mode="soft-light"/>
                      </filter>
                    </defs>
                    <g class="scale-bow" fill="none" stroke="#C5CCD1" stroke-width="0.85" opacity="0.34">
                      <circle cx="80" cy="14" r="2.15"/>
                      <path d="M80 16.2 V31"/>
                      <path d="M64 44 A 16 13 0 0 0 96 44"/>
                    </g>
                    <path d="M68 47 H92 V57 L116 73 L122 107 H38 L44 73 L68 57 Z" fill="#0C0E10"/>
                    <g clip-path="url(#wetWeightClip)">
                      <path d="M68 44 H92 V54 L116 70 L122 104 H38 L44 70 L68 54 Z" fill="url(#wetMetal)" filter="url(#wetGrain)"/>
                      <rect class="silver-sheen" x="58" y="58" width="16" height="40" fill="url(#wetSheen)"/>
                      <path d="M52 96 H108" stroke="#1E4D54" stroke-width="1" fill="none" opacity="0.65"/>
                      <path d="M54 78 H106 M50 98 H110" fill="none" stroke="#5E686F" stroke-width="0.45" opacity="0.55"/>
                    </g>
                    <path d="M68 44 H92 V54 L116 70 L122 104 H38 L44 70 L68 54 Z" fill="none" stroke="#C5CCD1" stroke-width="0.7"/>
                    <g filter="url(#wetFace)" text-anchor="middle" font-family="Cinzel, 'Times New Roman', serif" font-size="18" font-weight="700">
                      <text x="80.5" y="93.2" fill="#14181B" textLength="52" lengthAdjust="spacing">WET</text>
                      <text x="80" y="92.2" fill="url(#wetType)" textLength="52" lengthAdjust="spacing">WET</text>
                      <text x="80" y="92.2" fill="none" stroke="#F4F7F8" stroke-width="0.3" opacity="0.4" textLength="52" lengthAdjust="spacing">WET</text>
                    </g>
                  </svg>
                </div>
                <button type="button" id="lever-btn" class="lever-btn" aria-pressed="false" aria-label="WET에서 DRY로 전환">
                  <span class="lever-arm"><span class="lever-knob"></span></span>
                  <span class="lever-pivot"></span>
                </button>
                <div class="scale-pan scale-dry" aria-hidden="true">
                  <svg class="scale-svg" viewBox="0 0 160 118">
                    <defs>
                      <linearGradient id="dryMetal" x1="0" y1="0" x2="0.2" y2="1">

        { label: "제국의 질서와 계급 안에서 누구도 함부로 못 건드리는 확고한 지위를 얻는 것.", axis: "OK", val: 1, pulse: 1, npc: "sthildrune" },
        { label: "누구의 소유도 되지 않고, 분지의 틈새를 내 발로 자유롭게 누비며 사는 것.", axis: "OK", val: -1, pulse: 0, npc: "shezu" }

<!-- ============================================================
