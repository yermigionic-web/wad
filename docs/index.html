<script>
(function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var IRIS_MS = reduceMotion ? 1 : 700;

  var stage = byId("stage");
  var hubScroll = byId("hub-scroll");
  var sheet = byId("sheet");
  var sheetBody = byId("sheet-body");
  var sheetClose = byId("sheet-close");
  var pulse = byId("pulse");
  var pulseBody = byId("pulse-body");
  var pulseDim = byId("pulse-dim");
  var pulseClose = byId("pulse-close");
  var pulseReadout = byId("pulse-readout");
  var gaugeNeedle = byId("gauge-needle");
  var pulseRing = byId("pulse-ring");
  var toast = byId("toast");
  var iris = byId("iris");
  var veil = byId("veil");
  var logoFx = byId("logo-fx");
  var modal = byId("skip-modal");
  var audioBtn = byId("audio-btn");
  var leverBtn = byId("lever-btn");
  var leverMech = byId("lever-mech");
  var climateRead = byId("climate-read");
  var leverNote = byId("lever-note");
  var climateLive = byId("climate-live");
  var dossierList = byId("dossier-list");
  var archiveMount = byId("archive-mount");
  var tabs = byId("tabs");
  var vnText = byId("vn-text");
  var vnSpeaker = byId("vn-speaker");
  var vnCount = byId("vn-count");
  var vnFill = byId("vn-fill");
  var layerA = byId("vn-layer-a");
  var layerB = byId("vn-layer-b");

  var audio = new Audio(ASSET_CONFIG.bgm);
  audio.loop = true;
  audio.preload = "auto";
  audio.setAttribute("playsinline", "");
  var userMuted = false;
  var heldByModal = false;
  var fadeRaf = 0;
  var entered = false;
  var arriving = false;
  var sceneIndex = 0;
  var sceneLock = false;
  var bgToggle = 0;
  var savedScroll = 0;
  var gaugeRaf = 0;
  var toastTimer = 0;
  var bubbleTimer = 0;
  var lastResult = null;

  var typer = { text: "", i: 0, done: true, timer: 0, paused: false };
  var quiz = freshQuiz();
  var quizTimer = 0;

  function byId(id) { return document.getElementById(id); }
  function pad(n) {
    n = Math.max(0, n | 0);
    return (n < 10 ? "0" : "") + n;
  }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function gradeOf(n) {
    var g = DATA.pulseGrades[String(n)];
    return g || { roman: String(n), name: "", en: "" };
  }
  function rosterKeys() {
    return DATA.rosters.wet.concat(DATA.rosters.dry);
  }
  function setOpen(el, on) {
    el.classList.toggle("is-open", on);
    el.setAttribute("aria-hidden", on ? "false" : "true");
    try { el.inert = !on; } catch (err) { /* older webviews */ }
  }

  function placeholderElement(label) {
    var el = document.createElement("div");
    el.className = "ph";
    el.setAttribute("role", "img");
    el.setAttribute("aria-label", label || "plate unregistered");
    el.innerHTML =
      '<svg viewBox="0 0 120 150" aria-hidden="true">' +
        '<rect x="2" y="2" width="116" height="146" fill="none" stroke="#8C764C" stroke-width="0.7"/>' +
        '<rect x="7" y="7" width="106" height="136" fill="none" stroke="#3C5E5A" stroke-width="0.45"/>' +
        '<circle cx="60" cy="72" r="16" fill="none" stroke="#8C764C" stroke-width="0.7"/>' +
        '<path d="M60 56 V88 M44 72 H76" stroke="#8C764C" stroke-width="0.6"/>' +
        '<path d="M8 8 H18 M8 8 V18 M112 8 H102 M112 8 V18 M8 142 H18 M8 142 V132 M112 142 H102 M112 142 V132" stroke="#8C764C" stroke-width="0.8"/>' +
      "</svg>" +
      '<span class="ph-label">' + escapeHtml(label || "PLATE UNREGISTERED") + "</span>";
    return el;
  }

  function assignImage(img, src, alt) {
    if (!img) return;
    img.alt = alt || "";
    img.draggable = false;
    var parent = img.parentNode;
    if (parent) {
      var old = parent.querySelector(":scope > .ph");
      if (old) old.remove();
    }
    img.classList.remove("is-broken");
    img.onerror = function () {
      img.onerror = null;
      img.classList.add("is-broken");
      if (parent && !parent.querySelector(":scope > .ph")) {
        parent.appendChild(placeholderElement(alt || "PLATE UNREGISTERED"));
      }
    };
    if (!src) {
      img.onerror();
      return;
    }
    img.src = src;
  }

  function ticksHtml(n) {
    var html = '<span class="ticks">';
    var value = clamp(n | 0, 0, 9);
    var i;
    for (i = 1; i <= 9; i += 1) {
      html += '<i class="' + (i <= value ? "is-on" : "") + (i % 3 === 0 ? " is-major" : "") + '"></i>';
    }
    return html + "</span>";
  }

  function buildReticle() {
    var svg = byId("reticle-svg");
    if (!svg) return;
    function el(name, attrs) {
      var node = document.createElementNS(SVG_NS, name);
      Object.keys(attrs).forEach(function (key) { node.setAttribute(key, attrs[key]); });
      return node;
    }
    svg.appendChild(el("circle", { cx: "150", cy: "150", r: "146", fill: "none", stroke: "#8C764C", "stroke-width": "0.45" }));
    svg.appendChild(el("circle", { cx: "150", cy: "150", r: "112", fill: "none", stroke: "#3C5E5A", "stroke-width": "0.4" }));
    svg.appendChild(el("circle", { cx: "150", cy: "150", r: "78", fill: "none", stroke: "#8C764C", "stroke-width": "0.35", "stroke-dasharray": "1.2 3.2" }));
    var g = el("g", {});
    var i;
    for (i = 0; i < 120; i += 1) {
      var ang = (i / 120) * Math.PI * 2;
      var major = i % 10 === 0;
      var mid = i % 5 === 0;
      var inner = major ? 128 : (mid ? 134 : 139);
      g.appendChild(el("line", {
        x1: (150 + inner * Math.cos(ang)).toFixed(2),
        y1: (150 + inner * Math.sin(ang)).toFixed(2),
        x2: (150 + 146 * Math.cos(ang)).toFixed(2),
        y2: (150 + 146 * Math.sin(ang)).toFixed(2),
        stroke: "#8C764C",
        "stroke-width": major ? "0.9" : "0.4"
      }));
    }
    svg.appendChild(g);
    ["M150 6 V42", "M150 258 V294", "M6 150 H42", "M258 150 H294"].forEach(function (d) {
      svg.appendChild(el("path", { d: d, fill: "none", stroke: "#8C764C", "stroke-width": "0.55" }));
    });
    [[150, 16], [284, 150], [150, 284], [16, 150]].forEach(function (p) {
      svg.appendChild(el("circle", { cx: String(p[0]), cy: String(p[1]), r: "1.5", fill: "#8C764C" }));
    });
  }

  function buildGaugeTicks() {
    var g = byId("gauge-ticks");
    if (!g) return;
    var i;
    for (i = 0; i <= 16; i += 1) {
      var t = i / 16;
      var theta = Math.PI - t * Math.PI;
      var inner = i % 4 === 0 ? 74 : 80;
      var line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("x1", (120 + inner * Math.cos(theta)).toFixed(2));
      line.setAttribute("y1", (118 - inner * Math.sin(theta)).toFixed(2));
      line.setAttribute("x2", (120 + 90 * Math.cos(theta)).toFixed(2));
      line.setAttribute("y2", (118 - 90 * Math.sin(theta)).toFixed(2));
      line.setAttribute("stroke", t < 0.5 ? "#3C5E5A" : "#8C764C");
      line.setAttribute("stroke-width", i % 4 === 0 ? "1.1" : "0.55");
      g.appendChild(line);
    }
  }

  function buildParticles() {
    var field = byId("particle-field");
    if (!field) return;
    var html = "";
    var i;
    for (i = 0; i < 12; i += 1) {
      var size = (2 + Math.random() * 3).toFixed(1);
      html += '<i class="mote mist" style="left:' + (Math.random() * 100).toFixed(1) +
        "%;width:" + size + "px;height:" + size + "px;animation-duration:" + (14 + Math.random() * 16).toFixed(1) +
        "s;animation-delay:" + (-Math.random() * 20).toFixed(1) + "s;--dx:" + ((Math.random() * 40) - 20).toFixed(0) + 'px"></i>';
    }
    for (i = 0; i < 4; i += 1) {
      html += '<i class="mote mist wide" style="left:' + (Math.random() * 80).toFixed(1) +
        '%;width:90px;height:36px;animation-duration:' + (20 + Math.random() * 14).toFixed(1) +
        "s;animation-delay:" + (-Math.random() * 18).toFixed(1) + 's;--dx:18px"></i>';
    }
    for (i = 0; i < 16; i += 1) {
      var w = Math.random() > 0.6 ? 2 : 1;
      var h = Math.random() > 0.5 ? 4 : 2;
      html += '<i class="mote ash" style="left:' + (Math.random() * 100).toFixed(1) +
        "%;width:" + w + "px;height:" + h + "px;animation-duration:" + (9 + Math.random() * 12).toFixed(1) +
        "s;animation-delay:" + (-Math.random() * 14).toFixed(1) + "s;--dx:" + ((Math.random() * 28) - 10).toFixed(0) + 'px"></i>';
    }
    field.innerHTML = html;
  }

  function preload() {
    ASSET_CONFIG.backgrounds.forEach(function (src) {
      var img = new Image();
      img.src = src;
    });
    var logo = new Image();
    logo.src = ASSET_CONFIG.logo;
  }

  function fadeVolume(to, ms) {
    var from = audio.volume;
    var t0 = performance.now();
    cancelAnimationFrame(fadeRaf);
    function step(now) {
      var k = Math.min(1, (now - t0) / ms);
      audio.volume = from + (to - from) * k;
      if (k < 1) fadeRaf = requestAnimationFrame(step);
    }
    fadeRaf = requestAnimationFrame(step);
  }

  function syncAudioIcon() {
    var on = !audio.paused;
    audioBtn.classList.toggle("is-off", !on);
    audioBtn.setAttribute("aria-pressed", on ? "true" : "false");
    audioBtn.setAttribute("aria-label", on ? "배경음 일시정지" : "배경음 재생");
  }

  function toggleAudio() {
    if (audio.paused) {
      userMuted = false;
      heldByModal = false;
      audio.volume = 0.62;
      var playPromise = audio.play();
      if (playPromise && playPromise.catch) playPromise.catch(function () {});
    } else {
      userMuted = true;
      heldByModal = false;
      audio.pause();
    }
    syncAudioIcon();
  }

  function fadeInBgm() {
    if (userMuted) return;
    if (audio.paused) {
      audio.volume = 0;
      var playPromise = audio.play();
      var start = function () { fadeVolume(0.62, 1200); syncAudioIcon(); };
      if (playPromise && playPromise.then) playPromise.then(start, function () {});
      else start();
    } else if (audio.volume < 0.5) {
      fadeVolume(0.62, 800);
    }
    syncAudioIcon();
  }

  function resumeHeld() {
    if (heldByModal && !userMuted) {
      var playPromise = audio.play();
      if (playPromise && playPromise.catch) playPromise.catch(function () {});
    }
    heldByModal = false;
    syncAudioIcon();
  }

  function setScreen(name) {
    ["landing", "vn", "hub"].forEach(function (key) {
      var el = byId("screen-" + key);
      var on = key === name;
      el.classList.toggle("is-on", on);
      el.setAttribute("aria-hidden", on ? "false" : "true");
    });
    stage.setAttribute("data-screen", name);
  }

  function irisRadius() {
    return Math.ceil(Math.hypot(stage.clientWidth, stage.clientHeight) / 2) + 8;
  }

  function runIris(fromR, toR) {
    return new Promise(function (resolve) {
      iris.style.setProperty("--r", fromR + "px");
      iris.style.setProperty("--spin", "0deg");
      iris.classList.add("is-active");
      var t0 = performance.now();
      function frame(now) {
        var k = Math.min(1, (now - t0) / IRIS_MS);
        var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        var r = fromR + (toR - fromR) * e;
        iris.style.setProperty("--r", r.toFixed(2) + "px");
        iris.style.setProperty("--spin", (e * 32).toFixed(2) + "deg");
        if (k < 1) requestAnimationFrame(frame);
        else {
          if (toR > fromR) iris.classList.remove("is-active");
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }
  function irisClose() { return runIris(irisRadius(), 0); }
  function irisOpen() { return runIris(0, irisRadius()); }

  function enterBasin() {
    if (entered) return;
    entered = true;
    fadeInBgm();
    irisClose().then(function () {
      setScreen("vn");
      sceneIndex = 0;
      loadScene(0, { deferType: true });
      return irisOpen();
    }).then(function () {
      if (sceneIndex === 0 && typer.paused) resumeTyping();
    });
  }

  function loadScene(index, options) {
    var scene = DATA.vn[index];
    if (!scene) return;
    var src = ASSET_CONFIG.backgrounds[index] || "";
    var layers = [layerA, layerB];
    var incoming = layers[1 - bgToggle];
    var outgoing = layers[bgToggle];
    assignImage(incoming.querySelector("img"), src, scene.alt || "");
    incoming.classList.add("is-front");
    outgoing.classList.remove("is-front");
    bgToggle = 1 - bgToggle;
    vnSpeaker.textContent = scene.speaker || "";
    vnCount.textContent = pad(index + 1) + " / " + pad(DATA.vn.length);
    vnFill.style.width = ((index + 1) / DATA.vn.length * 100) + "%";
    if (!options || !options.deferType) startType(scene.text || "");
    else {
      clearTimeout(typer.timer);
      typer.text = scene.text || "";
      typer.i = 0;
      typer.done = false;
      typer.paused = true;
      vnText.classList.remove("is-done");
      vnText.textContent = "";
    }
  }

  function startType(text) {
    clearTimeout(typer.timer);
    typer.text = text;
    typer.i = 0;
    typer.done = false;
    typer.paused = false;
    vnText.classList.remove("is-done");
    vnText.textContent = "";
    typeStep();
  }
  function typeStep() {
    if (typer.paused) return;
    if (typer.i >= typer.text.length) {
      typer.done = true;
      vnText.classList.add("is-done");
      return;
    }
    var span = document.createElement("span");
    span.className = "ch";
    span.textContent = typer.text.charAt(typer.i);
    vnText.appendChild(span);
    typer.i += 1;
    var ch = typer.text.charAt(typer.i - 1);
    var delay = 28;
    if (ch === " ") delay = 12;
    else if (ch === "." || ch === "," || ch === "…" || ch === "?" || ch === "!") delay = 90;
    typer.timer = setTimeout(typeStep, delay);
  }
  function finishType() {
    clearTimeout(typer.timer);
    typer.i = typer.text.length;
    typer.done = true;
    typer.paused = false;
    vnText.textContent = typer.text;
    vnText.classList.add("is-done");
  }
  function pauseTyping() {
    clearTimeout(typer.timer);
    if (!typer.done) typer.paused = true;
  }
  function resumeTyping() {
    if (typer.done || !typer.paused) return;
    typer.paused = false;
    typeStep();
  }
  function nextScene() {
    if (sceneLock || arriving) return;
    sceneLock = true;
    setTimeout(function () { sceneLock = false; }, reduceMotion ? 1 : 260);
    if (sceneIndex >= DATA.vn.length - 1) {
      arriveHub();
      return;
    }
    sceneIndex += 1;
    loadScene(sceneIndex);
  }

  function arriveHub() {
    if (arriving) return;
    arriving = true;
    clearTimeout(typer.timer);
    setOpen(modal, false);
    veil.classList.add("is-on");
    setTimeout(function () {
      setScreen("hub");
      logoFx.classList.add("is-on");
      setTimeout(function () {
        logoFx.classList.remove("is-on");
        veil.classList.remove("is-on");
        arriving = false;
      }, reduceMotion ? 20 : 980);
    }, reduceMotion ? 10 : 280);
  }

  function openSkip() {
    if (arriving || stage.getAttribute("data-screen") !== "vn") return;
    heldByModal = !audio.paused;
    if (heldByModal) audio.pause();
    syncAudioIcon();
    pauseTyping();
    setOpen(modal, true);
    byId("skip-cancel").focus({ preventScroll: true });
  }
  function onSkipChoice(skip) {
    setOpen(modal, false);
    resumeHeld();
    if (skip) arriveHub();
    else resumeTyping();
  }

  function applyClimate(next, animate) {
    var meta = DATA.climate[next] || DATA.climate.wet;
    stage.setAttribute("data-climate", next);
    climateRead.textContent = meta.latin + "  ·  " + meta.reading;
    leverNote.textContent = meta.note || "";
    var dry = next === "dry";
    leverBtn.setAttribute("aria-pressed", dry ? "true" : "false");
    leverBtn.setAttribute("aria-label", dry ? "DRY에서 WET로 전환" : "WET에서 DRY로 전환");
    climateLive.textContent = (dry ? "DRY" : "WET") + " 모드";
    if (animate) {
      leverMech.classList.remove("is-clack");
      void leverMech.offsetWidth;
      leverMech.classList.add("is-clack");
    }
    renderRoster();
  }

  function renderRoster() {
    var climate = stage.getAttribute("data-climate") === "dry" ? "dry" : "wet";
    var keys = DATA.rosters[climate] || [];
    dossierList.innerHTML = keys.map(function (key, index) {
      var c = DATA.characters[key];
      if (!c) return "";
      var assets = ASSET_CONFIG.characters[key] || {};
      var grade = gradeOf(c.pulse);
      return (
        '<article class="card" data-key="' + escapeHtml(key) + '" tabindex="0" role="button" aria-label="' + escapeHtml(c.name) + '">' +
          '<div class="portrait-slot"><img class="portrait" alt="' + escapeHtml(c.name) + '" data-src="' + escapeHtml(assets.portrait || "") + '"></div>' +
          '<div class="card-body">' +
            '<span class="card-no caps">' + pad(index + 1) + "  /  " + escapeHtml(climate.toUpperCase()) + "</span>" +
            '<h3 class="card-name">' + escapeHtml(c.name) + "</h3>" +
            '<p class="card-alias alias">' + escapeHtml(c.alias) + "</p>" +
            '<div class="card-pulse"><span class="caps">PULSE ' + escapeHtml(String(c.pulse)) + "</span>" + ticksHtml(c.pulse) + "</div>" +
          "</div>" +
        "</article>"
      );
    }).join("");
    dossierList.querySelectorAll("img[data-src]").forEach(function (img) {
      assignImage(img, img.getAttribute("data-src"), img.alt);
    });
  }

  function richText(value) {
    return escapeHtml(value)
      .replace(/\*\*(.+?)\*\*/g, '<strong class="em-hit">$1</strong>')
      .replace(/\[(.+?)\]/g, '<em class="em-say">$1</em>')
      .replace(/&quot;(.+?)&quot;/g, '<em class="em-say">&ldquo;$1&rdquo;</em>')
      .replace(/'([^']+)'/g, '<strong class="em-term">$1</strong>');
  }

  function bioHtml(paragraphs, tone) {
    var list = paragraphs || [];
    return list.map(function (paragraph, index) {
      var last = index === list.length - 1;
      var cls = "bio-lead";
      if (tone === "rumor") cls = last ? "bio-barbed" : "bio-aside";
      else if (last && index > 0) cls = "bio-barbed";
      else if (index > 0) cls = "bio-aside";
      return '<p class="' + cls + '">' + richText(paragraph) + "</p>";
    }).join("");
  }

  function openDossier(key) {
    var c = DATA.characters[key];
    var assets = ASSET_CONFIG.characters[key] || {};
    if (!c) return;
    var grade = gradeOf(c.pulse);
    var intro = c.intro || [];
    var aspect = c.aspect ? ' <span class="em-note">(' + escapeHtml(c.aspect) + ")</span>" : "";
    var rumorParas = intro.slice(1);
    sheetBody.innerHTML =
      '<div class="editorial">' +
        '<div class="standing-slot"><img class="standing" alt="' + escapeHtml(c.name) + '"></div>' +
        '<div class="ed-caption">' +
          '<span class="caps">' + escapeHtml(String(c.faction || "").toUpperCase()) + " · PULSE " + escapeHtml(String(c.pulse)) + "</span>" +
          '<h2 class="ed-name">' + escapeHtml(c.name) + "</h2>" +
          '<p class="ed-alias alias">' + escapeHtml(c.alias) + "</p>" +
        "</div>" +
        '<button type="button" class="stamp" aria-label="인장 스티커">' +
          '<span class="stamp-photo"><img class="sticker" alt="' + escapeHtml(c.name) + '"></span>' +
          '<span class="bubble">' + stickerBubble(c.stickerLines) + "</span>" +
        "</button>" +
      "</div>" +
      '<div class="identity">' +
        '<div class="face-switch" data-show="official" role="group" aria-label="기록 면">' +
          '<button type="button" data-face="official" aria-pressed="true">제국 공식 신원서</button>' +
          '<button type="button" data-face="rumor" aria-pressed="false">뒷골목 찌라시</button>' +
          '<span class="face-bar" aria-hidden="true"></span>' +
        "</div>" +
        '<div class="faces" data-show="official">' +
          '<div class="face face-official">' +
            '<dl class="spec">' +
              '<div class="spec-race"><dt>종족</dt><dd><span class="em-race">' + escapeHtml(c.species || "—") + '</span><span class="em-pulse">PULSE ' + escapeHtml(String(c.pulse)) + '</span><span class="em-grade">' + escapeHtml(grade.name) + "</span></dd></div>" +
              '<div class="spec-job"><dt>직업</dt><dd class="em-job">' + escapeHtml(c.job || "—") + "</dd></div>" +
              '<div class="spec-measure"><dt>키 · 나이</dt><dd class="em-measure">' + escapeHtml(c.measure || "—") + aspect + "</dd></div>" +
            "</dl>" +
            '<div class="bio"><span class="caps bio-kicker">소개</span>' + bioHtml(intro, "official") + "</div>" +
          "</div>" +
          '<div class="face face-rumor"><p class="caps rumor-kicker">Unofficial · 유통 금지</p><div class="bio">' + bioHtml(rumorParas, "rumor") + "</div></div>" +
        "</div>" +
      "</div>";
    assignImage(sheetBody.querySelector(".standing"), assets.standing, c.name);
    assignImage(sheetBody.querySelector(".sticker"), assets.sticker, c.name);
    sheetBody.scrollTop = 0;
    setOpen(sheet, true);
    stage.setAttribute("data-sheet", "open");
    stage.scrollTop = 0;
    sheetClose.focus({ preventScroll: true });
    requestAnimationFrame(function () {
      stage.scrollTop = 0;
      sheetBody.scrollTop = 0;
    });
  }

  function closeSheet() {
    setOpen(sheet, false);
    stage.removeAttribute("data-sheet");
  }

  function setFace(face) {
    var faces = sheetBody.querySelector(".faces");
    var sw = sheetBody.querySelector(".face-switch");
    if (faces) faces.setAttribute("data-show", face);
    if (sw) sw.setAttribute("data-show", face);
    sheetBody.querySelectorAll("[data-face]").forEach(function (button) {
      button.setAttribute("aria-pressed", button.getAttribute("data-face") === face ? "true" : "false");
    });
  }

  function stickerBubble(lines) {
    return (lines || []).map(function (line) {
      return '<span class="bubble-line" hidden><span class="bubble-en">&ldquo;' + escapeHtml(line.en || "") + '&rdquo;</span><span class="bubble-ko">' + escapeHtml(line.ko || "") + "</span></span>";
    }).join("");
  }

  function bounceStamp(stamp) {
    var bubble = stamp.querySelector(".bubble");
    var lines = stamp.querySelectorAll(".bubble-line");
    var next = 0;
    lines.forEach(function (line, index) {
      if (!line.hidden) next = (index + 1) % lines.length;
      line.hidden = true;
    });
    if (lines.length) lines[next].hidden = false;
    stamp.classList.remove("is-boing");
    void stamp.offsetWidth;
    stamp.classList.add("is-boing");
    if (bubble) bubble.classList.add("is-on");
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      if (bubble) bubble.classList.remove("is-on");
    }, 4600);
  }

  function setTab(name) {
    var dossier = name !== "archive";
    byId("tab-dossier").setAttribute("aria-selected", dossier ? "true" : "false");
    byId("tab-archive").setAttribute("aria-selected", dossier ? "false" : "true");
    byId("view-dossier").classList.toggle("is-on", dossier);
    byId("view-archive").classList.toggle("is-on", !dossier);
    byId("view-archive").hidden = dossier;
    tabs.setAttribute("data-tab", dossier ? "dossier" : "archive");
    if (!dossier) closeSheet();
  }

  function archiveRich(value) {
    return escapeHtml(value)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/~~(.+?)~~/g, "<del>$1</del>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  function renderArchive() {
    byId("archive-lead").innerHTML = archiveRich((DATA.ui && DATA.ui.archiveLead) || "");
    archiveMount.innerHTML = (DATA.archive || []).map(function (sec, index) {
      var body = "";
      (sec.paragraphs || []).forEach(function (paragraph) {
        body += "<p>" + archiveRich(paragraph) + "</p>";
      });
      (sec.places || []).forEach(function (place) {
        body += '<div class="place"><b>' + escapeHtml(place.name || "") + "</b><p>" + archiveRich(place.text || "") + "</p></div>";
      });
      if (sec.grades && sec.grades.length) {
        body += '<ol class="grade-list">';
        sec.grades.forEach(function (grade) {
          body += "<li><span>" + escapeHtml(grade.roman) + "</span><span>" + escapeHtml(grade.feel) + "</span><em>" + escapeHtml(grade.en) + "</em></li>";
        });
        body += "</ol>";
      } else if (sec.gradeTable) {
        body += '<ol class="grade-list">';
        var n;
        for (n = 1; n <= 9; n += 1) {
          var grade = gradeOf(n);
          body += "<li><span>" + escapeHtml(grade.roman) + "</span><span>" + escapeHtml(grade.name) + "</span><em>" + escapeHtml(grade.en) + "</em></li>";
        }
        body += "</ol>";
      }
      if (sec.entries && sec.entries.length) {
        body += '<dl class="lex">';
        sec.entries.forEach(function (entry) {
          body += "<dt>" + escapeHtml(entry.term) + (entry.en ? "<em>" + escapeHtml(entry.en) + "</em>" : "") + "</dt><dd>" + archiveRich(entry.def) + "</dd>";
        });
        body += "</dl>";
      }
      var open = index === 0;
      return (
        '<section class="acc' + (open ? " is-open" : "") + '">' +
          '<button type="button" class="acc-head" aria-expanded="' + (open ? "true" : "false") + '">' +
            '<span class="acc-no">' + escapeHtml(sec.no || pad(index + 1)) + "</span>" +
            "<span><b>" + escapeHtml(sec.title || "") + "</b><small>" + escapeHtml(sec.kicker || "") + "</small></span>" +
            '<span class="acc-mark" aria-hidden="true"></span>' +
          "</button>" +
          '<div class="acc-body"><div class="acc-inner">' + body + "</div></div>" +
        "</section>"
      );
    }).join("");
  }

  function freshQuiz() {
    return { index: 0, answers: [], started: false, finished: false, locked: false };
  }

  function scoreAnswers(answers) {
    var axes = { WD: 0, SI: 0, CP: 0, OK: 0 };
    var pulseRaw = 0;
    var npcScores = {};
    Object.keys(DATA.npcNames || {}).forEach(function (key) { npcScores[key] = 0; });
    var slangTags = [];
    (answers || []).forEach(function (ans) {
      if (ans.axis && Object.prototype.hasOwnProperty.call(axes, ans.axis)) axes[ans.axis] += ans.val || 0;
      pulseRaw += ans.pulse || 0;
      if (ans.npc && Object.prototype.hasOwnProperty.call(npcScores, ans.npc)) npcScores[ans.npc] += 1;
      if (ans.tag) slangTags.push(ans.tag);
    });
    var code =
      (axes.WD > 0 ? "W" : "D") +
      (axes.SI > 0 ? "S" : "I") +
      (axes.CP > 0 ? "C" : "P") +
      (axes.OK > 0 ? "O" : "K");
    var species = (DATA.species && DATA.species[code]) || { name: code, summary: "", defaultQuirk: "" };
    var physiology = axes.WD > 0 ? "Wet(습성)" : "Dry(건성)";
    var pulseGrade = clamp(Math.round(1 + (pulseRaw / 15) * 8), 1, 9);
    var keys = Object.keys(npcScores);
    var bestNpcKey = keys.reduce(function (a, b) {
      return npcScores[a] >= npcScores[b] ? a : b;
    }, keys[0]);
    var bestNpcName = (DATA.npcNames && DATA.npcNames[bestNpcKey]) || "";
    var quirkText = slangTags.length
      ? "뒷골목에선 은근히 '" + slangTags[0] + "' 기질이 있다는 소문이 돈다."
      : (species.defaultQuirk || "");
    var copyPhys = axes.WD > 0 ? "Wet" : "Dry";
    var copyString = [
      "- 종족: " + (species.persona || species.name) + " (" + copyPhys + ")",
      "- 특성: " + (species.traits || ""),
      "- 신체 특징: " + (species.body || ""),
      "- 능력 특징: " + (species.ability || ""),
      "- PULSE: 시작 시 " + (species.recPulse || "") + " 추천"
    ].join("\n");
    return {
      code: code,
      species: species,
      physiology: physiology,
      pulseGrade: pulseGrade,
      pulseRaw: pulseRaw,
      axes: axes,
      bestNpcKey: bestNpcKey,
      bestNpcName: bestNpcName,
      quirkText: quirkText,
      copyString: copyString
    };
  }

  function updateGaugeReadout() {
    var live = quiz.finished && lastResult ? lastResult : scoreAnswers(quiz.answers);
    var grade = gradeOf(live.pulseGrade);
    var circ = 88;
    pulseRing.style.strokeDashoffset = String(circ * (1 - live.pulseGrade / 9));
    pulseRing.style.stroke = live.axes.WD < 0 ? "#B86F28" : "#1E4D54";
    pulseReadout.textContent = quiz.finished ? (live.code + "    PULSE " + grade.roman) : ("PULSE " + grade.roman + " · " + grade.name);
  }

  function startGaugeLoop() {
    stopGaugeLoop();
    function frame(t) {
      var live = quiz.finished && lastResult ? lastResult : scoreAnswers(quiz.answers);
      var balance = -(live.axes.WD / 5);
      var tremor = reduceMotion ? 0 : (live.pulseGrade / 9) * 1.7 * Math.sin(t / 78);
      var angle = balance * 72 + tremor;
      gaugeNeedle.setAttribute("transform", "rotate(" + angle.toFixed(2) + " 120 118)");
      gaugeRaf = requestAnimationFrame(frame);
    }
    gaugeRaf = requestAnimationFrame(frame);
  }
  function stopGaugeLoop() {
    if (gaugeRaf) cancelAnimationFrame(gaugeRaf);
    gaugeRaf = 0;
  }

  function specRow(label, value) {
    return "<div><dt>" + escapeHtml(label) + "</dt><dd>" + escapeHtml(value) + "</dd></div>";
  }

  function scrollPulseTop() {
    var panel = pulse.querySelector(".pulse-panel");
    if (panel) panel.scrollTop = 0;
  }

  function renderQuestion() {
    var item = DATA.quiz[quiz.index];
    if (!item) { renderResult(); return; }
    var total = DATA.quiz.length;
    var letters = ["A", "B", "C", "D"];
    var choices = (item.choices || []).map(function (choice, index) {
      return (
        '<button type="button" class="choice" data-choice="' + index + '">' +
          '<span class="choice-idx">' + letters[index] + "</span>" +
          "<span>" + escapeHtml(choice.label) + "</span>" +
        "</button>"
      );
    }).join("");
    var filled = total ? ((quiz.index) / total) * 100 : 0;
    pulseBody.innerHTML =
      '<p class="caps q-kicker">' + pad(quiz.index + 1) + " / " + pad(total) + "</p>" +
      '<div class="q-meter" aria-hidden="true"><span style="width:' + filled.toFixed(2) + '%"></span></div>' +
      '<h2 class="q-prompt">' + escapeHtml(item.prompt) + "</h2>" +
      '<div class="q-choices">' + choices + "</div>";
    updateGaugeReadout();
    scrollPulseTop();
  }

  function choose(index) {
    if (quiz.locked || quiz.finished) return;
    var item = DATA.quiz[quiz.index];
    if (!item || !item.choices || !item.choices[index]) return;
    quiz.locked = true;
    var choice = item.choices[index];
    quiz.answers.push({
      axis: choice.axis,
      val: choice.val,
      pulse: choice.pulse || 0,
      npc: choice.npc || "",
      tag: choice.tag || ""
    });
    var button = pulseBody.querySelector('[data-choice="' + index + '"]');
    if (button) button.classList.add("is-picked");
    pulseBody.querySelectorAll(".choice").forEach(function (el) { el.disabled = true; });
    updateGaugeReadout();
    var wait = (DATA.quizMeta && DATA.quizMeta.advanceMs) || 250;
    clearTimeout(quizTimer);
    quizTimer = setTimeout(function () {
      quizTimer = 0;
      quiz.locked = false;
      quiz.index += 1;
      if (quiz.index >= DATA.quiz.length) renderResult();
      else renderQuestion();
    }, wait);
  }

  function renderResult() {
    quiz.finished = true;
    quiz.locked = false;
    var result = scoreAnswers(quiz.answers);
    lastResult = result;
    var charKey = (DATA.npcKeys && DATA.npcKeys[result.bestNpcKey]) || "";
    var npc = DATA.characters[charKey];
    var grade = gradeOf(result.pulseGrade);
    var assets = (npc && ASSET_CONFIG.characters[npc.key]) || {};
    var line = result.copyString;
    pulseBody.innerHTML =
      '<article class="cert" id="cert">' +
        '<svg class="seal" viewBox="0 0 120 120" aria-hidden="true">' +
          "<defs><path id=\"sealRing\" d=\"M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0\"/></defs>" +
          '<circle cx="60" cy="60" r="52" fill="none" stroke="#8C764C" stroke-width="1"/>' +
          '<circle cx="60" cy="60" r="40" fill="none" stroke="#8C764C" stroke-width="0.5"/>' +
          '<text fill="#8C764C" font-size="7" font-family="Cinzel, serif" letter-spacing="1.6"><textPath href="#sealRing">IMPERIAL ASSAY · VEL-ARCA · </textPath></text>' +
          '<text x="60" y="64" text-anchor="middle" fill="#8C764C" font-size="11" font-family="Cinzel, serif">PULSE</text>' +
        "</svg>" +
        '<p class="caps cert-kicker">Imperial Assay</p>' +
        "<h2>" + escapeHtml(result.species.name) + "</h2>" +
        '<p class="latin">' + escapeHtml(result.code + " · " + result.physiology) + "</p>" +
        '<p class="trait">' + escapeHtml(result.species.summary) + "</p>" +
        '<p class="trait quirk">' + escapeHtml(result.quirkText) + "</p>" +
        '<div class="cert-photo"><img id="result-img" alt=""></div>' +
        '<div class="cert-npc"><p class="alias">초기 인연</p><h3>' + escapeHtml(npc ? npc.name : result.bestNpcName) + "</h3></div>" +
        '<dl class="spec">' +
          specRow("종족", result.species.name) +
          specRow("생리", result.physiology) +
          specRow("등급", result.pulseGrade + " · " + grade.roman + " " + grade.name) +
          specRow("인연", npc ? npc.name : result.bestNpcName) +
        "</dl>" +
        '<p class="copy-preview">' + escapeHtml(line) + "</p>" +
        '<div class="cert-actions">' +
          '<button type="button" class="text-btn" id="copy-persona">크랙 페르소나용 한 줄 복사</button>' +
          '<button type="button" class="text-btn ghost" id="retry-quiz">다시 측정하기</button>' +
        "</div>" +
      "</article>";
    assignImage(byId("result-img"), assets.portrait, npc ? npc.name : result.bestNpcName);
    updateGaugeReadout();
    scrollPulseTop();
    requestAnimationFrame(function () {
      var cert = byId("cert");
      if (cert) cert.classList.add("is-in");
    });
  }

  function fallbackCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    area.remove();
    return ok;
  }

  function copyPersona() {
    if (!lastResult) return;
    var line = lastResult.copyString;
    var done = function (ok) {
      if (ok) showToast("복사 완료. 크랙 페르소나에 붙여넣으세요.");
      else showToast("복사에 실패했습니다. 감정서의 문장을 길게 눌러 선택하세요.");
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(line).then(function () { done(true); }, function () { done(fallbackCopy(line)); });
    } else {
      done(fallbackCopy(line));
    }
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("is-on"); }, 2800);
  }

  function resetQuiz() {
    clearTimeout(quizTimer);
    quizTimer = 0;
    quiz = freshQuiz();
    quiz.started = true;
    lastResult = null;
    renderQuestion();
  }

  function openPulse() {
    savedScroll = hubScroll.scrollTop;
    if (!quiz.started) resetQuiz();
    else if (quiz.finished) renderResult();
    else renderQuestion();
    setOpen(pulse, true);
    stage.setAttribute("data-pulse", "open");
    startGaugeLoop();
    stage.scrollTop = 0;
    var panel = pulse.querySelector(".pulse-panel");
    if (panel) panel.scrollTop = 0;
    pulseClose.focus({ preventScroll: true });
  }
  function closePulse() {
    setOpen(pulse, false);
    stage.removeAttribute("data-pulse");
    stopGaugeLoop();
    hubScroll.scrollTop = savedScroll;
  }

  function bind() {
    audioBtn.addEventListener("click", toggleAudio);
    audio.addEventListener("play", syncAudioIcon);
    audio.addEventListener("pause", syncAudioIcon);
    byId("enter-btn").addEventListener("click", enterBasin);
    byId("skip-btn").addEventListener("click", function (event) {
      event.stopPropagation();
      openSkip();
    });
    byId("skip-confirm").addEventListener("click", function () { onSkipChoice(true); });
    byId("skip-cancel").addEventListener("click", function () { onSkipChoice(false); });
    byId("skip-dim").addEventListener("click", function () { onSkipChoice(false); });
    byId("screen-vn").addEventListener("click", function (event) {
      if (event.target.closest("button, a, .modal")) return;
      if (modal.classList.contains("is-open") || arriving) return;
      if (!typer.done) finishType();
      else nextScene();
    });
    leverBtn.addEventListener("click", function () {
      var next = stage.getAttribute("data-climate") === "dry" ? "wet" : "dry";
      applyClimate(next, true);
    });
    byId("tab-dossier").addEventListener("click", function () { setTab("dossier"); });
    byId("tab-archive").addEventListener("click", function () { setTab("archive"); });
    dossierList.addEventListener("click", function (event) {
      var card = event.target.closest(".card");
      if (!card) return;
      openDossier(card.getAttribute("data-key"));
    });
    dossierList.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" && event.key !== " ") return;
      var card = event.target.closest(".card");
      if (!card) return;
      event.preventDefault();
      openDossier(card.getAttribute("data-key"));
    });
    dossierList.addEventListener("pointerdown", function (event) {
      var card = event.target.closest(".card");
      if (card) card.classList.add("is-awake");
    });
    dossierList.addEventListener("pointerup", function () {
      dossierList.querySelectorAll(".is-awake").forEach(function (card) { card.classList.remove("is-awake"); });
    });
    dossierList.addEventListener("pointercancel", function () {
      dossierList.querySelectorAll(".is-awake").forEach(function (card) { card.classList.remove("is-awake"); });
    });
    sheetClose.addEventListener("click", closeSheet);
    sheet.addEventListener("click", function (event) {
      var face = event.target.closest("[data-face]");
      if (face) { setFace(face.getAttribute("data-face")); return; }
      var stamp = event.target.closest(".stamp");
      if (stamp) bounceStamp(stamp);
    });
    archiveMount.addEventListener("click", function (event) {
      var head = event.target.closest(".acc-head");
      if (!head) return;
      var acc = head.parentNode;
      var open = acc.classList.toggle("is-open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
    });
    byId("fab").addEventListener("click", openPulse);
    byId("open-pulse-banner").addEventListener("click", openPulse);
    pulseClose.addEventListener("click", closePulse);
    pulseDim.addEventListener("click", closePulse);
    pulseBody.addEventListener("click", function (event) {
      if (event.target.closest("#copy-persona")) { copyPersona(); return; }
      if (event.target.closest("#retry-quiz")) { resetQuiz(); return; }
      var choice = event.target.closest("[data-choice]");
      if (choice) choose(Number(choice.getAttribute("data-choice")));
    });
    document.addEventListener("keydown", function (event) {
      if (event.key !== "Escape") return;
      if (modal.classList.contains("is-open")) { onSkipChoice(false); return; }
      if (pulse.classList.contains("is-open")) { closePulse(); return; }
      if (sheet.classList.contains("is-open")) closeSheet();
    });
  }

  function init() {
    buildReticle();
    buildGaugeTicks();
    buildParticles();
    assignImage(byId("logo-img"), ASSET_CONFIG.logo, "WET AND DRY");
    assignImage(byId("logo-fx-img"), ASSET_CONFIG.logo, "");
    assignImage(byId("land-bg-img"), ASSET_CONFIG.backgrounds[0], (DATA.vn[0] && DATA.vn[0].alt) || "");
    assignImage(
      byId("archive-banner-img"),
      ASSET_CONFIG.archiveBanner,
      (DATA.ui && DATA.ui.archiveBannerAlt) || ""
    );
    applyClimate("wet", false);
    renderArchive();
    bind();
    preload();
    syncAudioIcon();
    updateGaugeReadout();
    setScreen("landing");
    stage.addEventListener("scroll", function () {
      if (stage.scrollTop !== 0 || stage.scrollLeft !== 0) {
        stage.scrollTop = 0;
        stage.scrollLeft = 0;
      }
    });
  }

  init();
})();
</script>
</body>
</html>
